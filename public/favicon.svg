<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Royal Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="50%" stop-color="#0A1D37"/>
      <stop offset="100%" stop-color="#031024"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Text Gradient: Brilliant Cyan to Pure White -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Jet Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Contrail Glow Gradient -->
    <linearGradient id="contrailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="jetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Squircle Corners -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Radial Ambient Glow inside tile -->
  <circle cx="256" cy="180" r="170" fill="#0EA5E9" opacity="0.16"/>
  <circle cx="390" cy="110" r="100" fill="#F59E0B" opacity="0.18"/>

  <!-- Travel Globe Longitude/Latitude Decorative Lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="2.5" fill="none">
    <circle cx="256" cy="256" r="210"/>
    <ellipse cx="256" cy="256" rx="120" ry="210"/>
    <ellipse cx="256" cy="256" rx="210" ry="100"/>
    <line x1="46" y1="256" x2="466" y2="256"/>
  </g>

  <!-- Supersonic Flight Contrail Arc -->
  <path d="M 60 380 Q 180 340 280 230 T 400 95" 
        fill="none" 
        stroke="url(#contrailGrad)" 
        stroke-width="7" 
        stroke-linecap="round"
        stroke-dasharray="12 8"
        opacity="0.85"/>

  <!-- Soaring Luxury Jet / Airplane (Stylized Silhouette) -->
  <g transform="translate(385, 100) rotate(-22) scale(1.15)" filter="url(#jetGlow)">
    <!-- Jet Fuselage & Wings -->
    <path d="M 0 -38 
             C 3 -28 4 -12 4 4 
             L 36 22 
             C 38 24 37 28 33 28 
             L 5 20 
             L 4 36 
             L 16 46 
             C 17 47 16 50 14 50 
             L 0 46 
             L -14 50 
             C -16 50 -17 47 -16 46 
             L -4 36 
             L -5 20 
             L -33 28 
             C -37 28 -38 24 -36 22 
             L -4 4 
             C -4 -12 -3 -28 0 -38 Z" 
          fill="url(#goldGrad)"/>
    <!-- Cockpit / Core Highlight -->
    <ellipse cx="0" cy="-14" rx="2" ry="7" fill="#FFFFFF"/>
  </g>

  <!-- Luxury 4-Point Travel Compass Sparkles -->
  <g fill="#FDE68A" opacity="0.9" filter="url(#softGlow)">
    <!-- Top-left sparkle -->
    <path d="M 96 110 Q 96 126 80 126 Q 96 126 96 142 Q 96 126 112 126 Q 96 126 96 110 Z"/>
    <!-- Bottom-right sparkle -->
    <path d="M 432 390 Q 432 400 422 400 Q 432 400 432 410 Q 432 400 442 400 Q 432 400 432 390 Z" transform="scale(0.8) translate(70, 70)"/>
  </g>

  <!-- Main Brand Acronym "MNP" (Bold, Distinct, High Contrast) -->
  <g filter="url(#softGlow)">
    <!-- Shadow for ultra depth -->
    <text x="256" y="286" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="162" 
          letter-spacing="5" 
          fill="#020813" 
          opacity="0.6">MNP</text>
    
    <!-- Foreground Text -->
    <text x="256" y="282" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="162" 
          letter-spacing="5" 
          fill="url(#textGrad)">MNP</text>
  </g>

  <!-- Sub-Badge Pill: "HOLIDAYS" -->
  <g filter="url(#softGlow)">
    <!-- Golden Accent Pill -->
    <rect x="96" y="328" width="320" height="66" rx="33" fill="url(#pillGrad)"/>
    <rect x="99" y="331" width="314" height="60" rx="30" fill="none" stroke="#FEF08A" stroke-width="2.5" opacity="0.75"/>
    
    <!-- Text "HOLIDAYS" -->
    <text x="256" y="373" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="34" 
          letter-spacing="8" 
          fill="#FFFFFF">HOLIDAYS</text>
  </g>

  <!-- Bottom Subtitle Tag: "PVT. LTD." -->
  <text x="256" y="442" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="20" 
        letter-spacing="5" 
        fill="#38BDF8" 
        opacity="0.95">PVT. LTD.</text>
</svg>